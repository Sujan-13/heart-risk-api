services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: heart-disease-api:local
    ports:
      - "8000:8000"
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/logs.db
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  api-data:
